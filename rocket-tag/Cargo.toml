[package]
name = "rocket-tag"
version = "0.1.0"
edition = "2024"

# Workspace a sé: rocket-tag non entra in workspace di altre cartelle (REQ-079).
[workspace]

[lib]
name = "rocket_tag"
path = "src/lib.rs"

[[bin]]
name = "rocket-tag"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
