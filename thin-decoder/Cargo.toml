[package]
name = "thin-decoder"
version = "0.1.0"
edition = "2021"
description = "Risposte tracciabili a domande su un testo in inglese; LLM locale opzionale, spento di default"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json"] }
