[package]
name = "search-rm3"
version = "0.1.0"
edition = "2024"

# Workspace a sé: search-rm3 non entra in workspace di altre cartelle (REQ-060).
[workspace]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rust-stemmers = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
