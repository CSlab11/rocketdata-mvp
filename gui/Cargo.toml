[package]
name = "gui"
version = "0.1.0"
edition = "2024"

# Workspace a sé: gui non entra in workspace di altre cartelle (REQ-024).
[workspace]

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
open = "5.4.5"
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
ureq = "3.5.0"
