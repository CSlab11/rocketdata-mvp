[package]
name = "gui"
version = "0.1.0"
edition = "2024"

# Workspace a sé: gui non entra in workspace di altre cartelle (REQ-024).
[workspace]

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
ureq = "3.5.0"
