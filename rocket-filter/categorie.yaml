# ───────────── Categorie trasversali (PROPOSTA, da rivedere) ─────────────
# Temi che attraversano più discipline. Possono puntare a categorie intere
# (`include`) o a clausole specifiche di uno standard (`clausole`).
categorie_trasversali:
  - id: T-PM
    nome: Project management
    include: [M-10, M-40, M-60, M-80]
  - id: T-COSTI
    nome: Gestione dei costi
    # M-ST-60C: cap. 6 principi di costo, cap. 9 requisiti di costo, annex DRD di costo
    # (A CBS, D price breakdown, E geographical distribution, F-G cost estimate, H MPP,
    #  I inventory, J cost and manpower, K-L OBCP/CBCP, M-N EAC/ETC, O CCN, Q-R informativi)
    clausole:
      - {codice: "ECSS-M-ST-60C", clausole: ["6", "9", "A", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M", "N", "O", "Q", "R"]}
  - id: T-SCHEDULE
    nome: Gestione della schedule
    # M-ST-60C: cap. 5 principi di schedule, cap. 8 requisiti di schedule,
    # annex DRD B (schedule) e C (schedule progress report)
    clausole:
      - {codice: "ECSS-M-ST-60C", clausole: ["5", "8", "B", "C"]}
  - id: T-SW
    nome: Software
    include: [E-40, Q-80]
  - id: T-TEST
    nome: Test e verifica
    standard:
      - "ECSS-E-ST-10-02C Rev.1"
      - "ECSS-E-ST-10-03C Rev.1"
      - "ECSS-Q-ST-20-07C"
      - "ECSS-E-ST-35-10C"
      - "ECSS-E-ST-70-32C"
  - id: T-RAD
    nome: Radiazioni
    standard:
      - "ECSS-E-ST-10-04C Rev.1"
      - "ECSS-E-ST-10-12C"
      - "ECSS-Q-ST-60-15C Rev.1"
  - id: T-FPGA
    nome: ASIC / FPGA
    standard:
      - "ECSS-E-ST-20-40C"
      - "ECSS-Q-ST-60-03C"

# ───────────── Temi generici (livello "temi") ─────────────
# Categorie per argomento, trasversali a tutti gli standard. Non dipendono dalla struttura ECSS:
# ogni tema è definito da una descrizione e da termini seme (in inglese, come gli standard).
# Membri di un tema (python query.py membri --categoria cost per controllarli):
#   1. ancore (facoltative): standard o clausole che trattano proprio quell'argomento, inclusi per intero;
#   2. le unità più vicine ai semi, con un bonus se un seme compare letteralmente nel titolo o nel termine.
# Si possono aggiungere, togliere o modificare liberamente; poi: python ingest.py --solo-prototipi
temi:
  - id: cost
    nome: Cost and finance
    descrizione: cost estimating, budget control, prices, payments and financial reporting of a space project
    semi: [cost estimate, budget, cost breakdown structure, estimate at completion, price, payment plan, manpower cost, financial report, cost control, cost overrun]
    ancore: [{codice: "ECSS-M-ST-60C", clausole: ["6", "9", "A", "D", "E", "F", "G", "H", "I", "J", "K", "L", "M", "N", "O", "Q"]}]
  - id: schedule
    nome: Schedule and planning
    descrizione: project planning, schedules, milestones and progress monitoring
    semi: [schedule, milestone, critical path, project planning, Gantt chart, schedule progress report, work package, baseline schedule, delay]
    ancore: [{codice: "ECSS-M-ST-60C", clausole: ["5", "8", "B", "C"]}]
  - id: customer
    nome: Customer and stakeholders
    descrizione: relationship between customer, supplier and stakeholders, approvals and acceptance by the customer
    semi: [customer, supplier, customer-supplier relationship, stakeholder, customer approval, contractor, end user, acceptance by the customer]
  - id: contract
    nome: Contracts and agreements
    descrizione: business agreements, contracts, statements of work and contract changes
    semi: [business agreement, contract, statement of work, contract change notice, fixed price contract, cost reimbursement contract, contractual obligation]
    ancore: [{codice: "ECSS-M-ST-60C", clausole: ["6.2", "9.1", "O"]}]
  - id: procurement
    nome: Procurement and supply chain
    descrizione: procurement of items and components, supplier selection, subcontracting and incoming inspection
    semi: [procurement, purchase order, supplier selection, subcontractor, lot acceptance, parts procurement, off-the-shelf items, incoming inspection, procurement specification]
  - id: risk
    nome: Risk management
    descrizione: identification, assessment, mitigation and tracking of project risks
    semi: [risk assessment, risk mitigation, risk register, risk index, likelihood and severity, risk acceptance, uncertainty]
    ancore: ["ECSS-M-ST-80C"]
  - id: quality
    nome: Quality assurance
    descrizione: quality assurance, inspections, audits, nonconformances and corrective actions
    semi: [quality assurance, nonconformance, inspection, audit, quality record, workmanship, corrective action, mandatory inspection point]
    ancore: ["ECSS-Q-ST-20C Rev.2", "ECSS-Q-ST-10-09C Rev.1"]
  - id: safety
    nome: Safety
    descrizione: hazards, safety analyses and protection of people and equipment
    semi: [hazard, hazard analysis, safety critical, catastrophic consequence, safety risk, hazardous material, personnel safety]
    ancore: ["ECSS-Q-ST-40C Rev.1", "ECSS-Q-ST-40-02C"]
  - id: dependability
    nome: Dependability and reliability
    descrizione: reliability, availability, maintainability, failure analysis and redundancy
    semi: [reliability, availability, failure modes and effects analysis, FMECA, redundancy, derating, failure rate, single point failure]
    ancore: ["ECSS-Q-ST-30C Rev.1", "ECSS-Q-ST-30-02C", "ECSS-Q-ST-30-09C"]
  - id: configuration
    nome: Configuration and documentation
    descrizione: configuration management, baselines, change control and project documentation
    semi: [configuration management, configuration item, baseline, change control, document requirements definition, documentation, version control, configuration status accounting]
