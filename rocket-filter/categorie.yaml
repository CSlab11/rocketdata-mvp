# Albero delle categorie ECSS
# Fonte: elenco standard attivi su ecss.nl (144 standard, stato novembre 2026)
# Livelli: ramo > disciplina > (sotto-disciplina) > standard
# Ogni categoria ha un `parent` (null = radice): si mappa su categories.parent_id.
# `descrizione`: da popolare in ingestione con lo Scope (clausola 1) degli standard.

