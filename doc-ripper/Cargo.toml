[package]
name = "doc-ripper"
version = "0.1.0"
edition = "2024"

# Workspace a sé: doc-ripper non entra in workspace di altre cartelle (REQ-008).
[workspace]

[dependencies]
calamine = "0.37.0"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
docx-rs = { version = "0.4.22", default-features = false }
walkdir = "2.5.0"

[dev-dependencies]
rust_xlsxwriter = "0.101.0"
tempfile = "3.27.0"
zip = "9.0.5"
